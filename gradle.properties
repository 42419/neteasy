# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# release 包 R8 混淆是 NoIsolationWorkerFactory 跑在同一个 Gradle daemon JVM 里的，
# 之前 2048m 在类数量不多的时候还够用，引入 Kyant0 backdrop 库之后 R8 处理的类变多，
# 直接 OutOfMemoryError: Java heap space，提到 4096m
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# AGP 9 开启正式 R8（optimization.enable=true 需要该旗标；渐进式 R8 支持）
android.r8.gradual.support=true

# ===== neteasy 内嵌 Rust 后端 =====
# 构建时从 https://github.com/42419/neteasy-backend 的 Release 下载预编译动态库，并逐个校验 SHA-256。
# 升级后端：把版本号和下面三个 SHA-256 一起改（SHA-256 见该 Release 里的 SHA256SUMS 文件）。
neteasy.backendVersion=v0.1.1
neteasy.backendSha256.arm64-v8a=3ba2e3c6be07742d22bd3160b7e6e5fe5c55f7919553563f8764575e87ec387c
neteasy.backendSha256.armeabi-v7a=c93e35a05aeb0302be9705acc08fde2b67f475709f71ec4d533448509885617d
neteasy.backendSha256.x86_64=adea797e29317268e14812daa5667cc6b3912e828731c26921b856f7ee770fce
# 本地调试后端（可选）：指向 `cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o jniLibs build --release --lib`
# 的产物目录（里面是 <abi>/libneteasy_backend.so），设置后跳过下载。也可用环境变量 NETEASY_BACKEND_JNILIBS_DIR。
# neteasy.backendJniLibsDir=D:/path/to/neteasy-backend/jniLibs
