kotlin.code.style=official

# ===== neteasy 内嵌 Node 后端 =====
# api-enhanced 仓库路径（SyncNodeProject 任务从这里同步源码；用正斜杠避免转义）
# 解析优先级：环境变量 NETEASY_NODE_PROJECT_DIR > 此处 neteasy.nodeProjectDir > 构建报错提示
neteasy.nodeProjectDir=D:/desktop/projects/github/api-enhanced
