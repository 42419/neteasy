name: CI

# 每次推送 / PR 都会跑：编译 + 单元测试，以及在 x86_64 模拟器上跑内嵌 Rust 后端的端到端测试。
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 编译 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 版本号取自 git tag，需要完整历史
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            build-tools;37.0.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: 编译 debug + 单元测试
        run: .github/scripts/run.sh "build" ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: 确认 APK 里带上了 Rust 后端动态库
        run: |
          for apk in app/build/outputs/apk/debug/*.apk; do
            echo "== $apk"
            unzip -l "$apk" | grep -E "libneteasy_backend|libnode|libnative-lib" || true
          done
          # 每个 ABI 的 APK 都必须有 libneteasy_backend.so，而且不能再有 libnode
          for apk in app/build/outputs/apk/debug/*.apk; do
            unzip -l "$apk" | grep -q "libneteasy_backend.so" || { echo "::error::$apk 缺少 libneteasy_backend.so"; exit 1; }
            if unzip -l "$apk" | grep -q "libnode.so"; then echo "::error::$apk 里仍有 libnode.so"; exit 1; fi
          done
          sizes=$(for apk in app/build/outputs/apk/debug/*.apk; do printf '%s=%s ' "$(basename "$apk")" "$(stat -c %s "$apk")"; done)
          echo "::notice title=APK 体积（字节）::$sizes"
      - uses: actions/upload-artifact@v4
        with:
          name: neteasy-apk-debug
          path: app/build/outputs/apk/debug/*.apk

  emulator:
    name: 模拟器端到端测试（API 34 / x86_64）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            build-tools;37.0.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: 开启 KVM（模拟器硬件加速）
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 在模拟器上跑仪器测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: .github/scripts/run.sh "connectedAndroidTest" ./gradlew :app:connectedDebugAndroidTest -Pneteasy.noAbiSplits --stacktrace
