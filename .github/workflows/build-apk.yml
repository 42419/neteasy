name: Build APK

on:
  # 手动触发：可在 Actions 页面选择 debug / release
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        type: choice
        options:
          - debug
          - release
        default: debug
  # 打 tag 触发（如 v1.0.0）：构建 release 并自动发布 GitHub Release
  push:
    tags:
      - 'v*'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 创建 Release 需要

env:
  # 手动触发用输入值；tag 触发固定 release
  BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # platform 37（compileSdk 37）；后端是预编译的 Rust 动态库，不再需要 NDK / CMake
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            build-tools;37.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 固定发布签名：从 GitHub Secrets 解出 keystore，仅 release 构建需要。
      # 没配 secrets（比如 fork 出去的仓库）时这步会静默跳过，release 会退回 debug 签名
      # （见 app/build.gradle.kts），能编译能装，但每次签名不一样，不能当正式发布用。
      - name: Decode release keystore
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
            echo "keystore_path=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 KEYSTORE_BASE64 secret，release 构建将退回 debug 签名（每次签名不同，不能当正式发布包）"
          fi

      # 后端动态库由 Gradle 的 fetchBackendLibs 任务从 neteasy-backend 的 Release 下载并校验 SHA-256
      - name: Build APK
        env:
          NETEASY_KEYSTORE_PATH: ${{ env.keystore_path }}
          NETEASY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NETEASY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NETEASY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            ./gradlew :app:assembleDebug --stacktrace
          fi
        shell: bash

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neteasy-apk-${{ env.BUILD_TYPE }}
          path: app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
          if-no-files-found: error

      # 仅 tag 触发时：把 APK 挂到对应的 GitHub Release 上
      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
