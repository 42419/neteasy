name: Build APK

on:
  # 手动触发：可在 Actions 页面选择 debug / release
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        type: choice
        options:
          - debug
          - release
        default: debug
  # 打 tag 触发（如 v1.0.0）：构建 release 并自动发布 GitHub Release
  push:
    tags:
      - 'v*'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 创建 Release 需要

env:
  # 手动触发用输入值；tag 触发固定 release
  BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # platform 37（compileSdk 37）+ NDK 28.2.13676358 + CMake 3.22.1（JNI 桥）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            build-tools;37.0.0
            ndk;28.2.13676358
            cmake;3.22.1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # nodejs-mobile 预编译产物不入库（.gitignore），CI 现下现用。
      # zip 结构：bin/<ABI>/libnode.so + include/node/（无 libc++_shared.so）
      - name: Download nodejs-mobile prebuilt libnode
        run: |
          curl -sL -o /tmp/nodejs-mobile.zip \
            "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip"
          unzip -q /tmp/nodejs-mobile.zip -d /tmp/nodejs-mobile
          mkdir -p app/libnode
          cp -r /tmp/nodejs-mobile/bin app/libnode/bin
          cp -r /tmp/nodejs-mobile/include app/libnode/include

      # libnode.so 依赖 libc++_shared.so，zip 里没有，必须从 NDK 拷贝，
      # 否则 APK 运行时 dlopen(libnode.so) 失败。
      # NDK 28 的 sysroot 目录用 target triple 命名（aarch64-linux-android 等），
      # 旧版 NDK 用 ABI 名（arm64-v8a 等），这里两种都匹配。
      - name: Copy libc++_shared.so from NDK
        run: |
          NDK="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          if [ ! -d "$NDK" ]; then
            echo "::error::NDK not found at $NDK (ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT)"
            exit 1
          fi
          copy_libcxx() {
            local ABI="$1" TRIPLE="$2"
            local LIB
            LIB="$(find "$NDK" -name 'libc++_shared.so' \( -path "*/${ABI}/*" -o -path "*/${TRIPLE}/*" \) | head -n 1)"
            if [ -z "$LIB" ]; then
              echo "::error::libc++_shared.so not found for ${ABI} in NDK"
              exit 1
            fi
            cp "$LIB" "app/libnode/bin/${ABI}/libc++_shared.so"
            echo "copied ${LIB} -> app/libnode/bin/${ABI}/"
          }
          copy_libcxx arm64-v8a aarch64-linux-android
          copy_libcxx armeabi-v7a arm-linux-androideabi
          copy_libcxx x86_64 x86_64-linux-android

      # 后端源码：SyncNodeProject 任务从该仓库同步进 assets，并 pnpm 装依赖
      - name: Clone api-enhanced backend
        run: |
          git clone --depth 1 \
            https://github.com/NeteaseCloudMusicApiEnhanced/api-enhanced.git \
            "${{ runner.temp }}/api-enhanced"

      # 固定发布签名：从 GitHub Secrets 解出 keystore，仅 release 构建需要。
      # 没配 secrets（比如 fork 出去的仓库）时这步会静默跳过，release 会退回 debug 签名
      # （见 app/build.gradle.kts），能编译能装，但每次签名不一样，不能当正式发布用。
      - name: Decode release keystore
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
            echo "keystore_path=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 KEYSTORE_BASE64 secret，release 构建将退回 debug 签名（每次签名不同，不能当正式发布包）"
          fi

      - name: Build APK
        env:
          # 环境变量优先于 gradle.properties 里的 neteasy.nodeProjectDir
          NETEASY_NODE_PROJECT_DIR: ${{ runner.temp }}/api-enhanced
          NETEASY_KEYSTORE_PATH: ${{ env.keystore_path }}
          NETEASY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NETEASY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NETEASY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            ./gradlew :app:assembleDebug --stacktrace
          fi
        shell: bash

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neteasy-apk-${{ env.BUILD_TYPE }}
          path: app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
          if-no-files-found: error

      # 仅 tag 触发时：把 APK 挂到对应的 GitHub Release 上
      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
